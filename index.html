<style>
:root{--bg:#2a0e14;--ink:#f4e8da;--mute:#bfa39b;--gold:#d0a070;--line:rgba(208,160,112,.3);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--sans);-webkit-text-size-adjust:100%}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.logo{display:block;margin:0 auto;height:auto}
.rule{width:56px;height:1px;background:var(--gold);margin:16px auto 12px}
.sub{font:italic 500 19px var(--serif);color:var(--gold);text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 90% 70% at 50% 0,#4d1a24 0,#2a0e14 75%);padding:calc(32px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom))}
main{width:100%;max-width:420px;text-align:center}
.logo{width:min(380px,82vw)}
h1{font:600 38px/1.1 var(--serif);margin:38px 0 6px}
.lead{color:var(--mute);font-size:16px;margin-bottom:22px}
.contact{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:16px;line-height:1.6}
.contact address{font-style:normal}
.contact a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.contact a:hover{border-bottom-color:var(--gold)}
.btns{display:grid;gap:14px}
.btn{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--gold);padding:17px 20px;font:500 24px var(--serif);transition:background .2s,color .2s}
.btn:hover,.btn:active{background:var(--gold);color:var(--bg)}
.copy{margin-top:28px;color:var(--mute);font-size:13px}
</style>
